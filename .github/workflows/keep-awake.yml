# Free Render servers sleep after 15 minutes without visitors and take about a
# minute to wake up. Free Supabase projects pause after a week of no activity.
# This pings the backend every 10 minutes so neither happens.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables tab ->
#        New repository variable: BACKEND_URL = https://your-backend.onrender.com
# Until BACKEND_URL is set, the job skips itself.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping the backend and database
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 \
            "${{ vars.BACKEND_URL }}/health/db"
